services:
  - type: web
    name: supermegabot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python3 dashboard/server.py
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8888
    healthCheckPath: /health
    autoDeploy: true
